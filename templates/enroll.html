<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VerifyME - Enroll</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <h1>VerifyME - Enroll New Employee</h1>

        <div class="form-fields">
            <input type="text" id="employeeId" placeholder="Employee ID" />
            <input type="text" id="employeeName" placeholder="Full Name" />
        </div>

        <video id="video" autoplay playsinline></video>
        <canvas id="canvas" style="display:none;"></canvas>

        <div class="controls">
            <button id="enrollBtn">Capture & Enroll</button>
        </div>

        <div id="result" class="result-box"></div>

        <p class="link-row"><a href="/">Go to Verification →</a></p>
    </div>

    <script src="/static/js/camera.js"></script>
    <script src="/static/js/enroll.js"></script>
</body>
</html>
